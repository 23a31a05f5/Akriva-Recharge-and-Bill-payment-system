<!DOCTYPE html>
<html>
    <head>
        <title>Akriva-Bills</title>
    </head>
    <body>
        <h1>Bill payment</h1>
        <form action="/bills" method="POST">
            <label>Customer Name:</label>
            <input type="text" name="customer_name">
            <br><br>
            <label>Bill ID:</label>
            <input type="number" name="bill_id">
            <br><br>

            <label>Select bill type:</labellabel>
            <select name="bill_type">
                <option>Electricity</option>
                <option>Mobile</option>
                <option>DTH</option>
            </select>
            <br><br>

            <label>Amount:</label>
            <input type="number" name="amount">
            <br><br>
            <button type="submit">Pay NOW</button>
    </form>
    </body>
</html>
